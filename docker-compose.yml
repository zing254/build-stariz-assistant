version: '3.8'

services:
  # Ollama AI Model Server
  ollama:
    image: ollama/ollama:latest
    container_name: stariz-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Python Backend Service (Production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stariz-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/stariz_tools/data:/app/backend/stariz_tools/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
      - STARIZ_MODEL=qwen3:4b
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: stariz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
  ollama_data:
